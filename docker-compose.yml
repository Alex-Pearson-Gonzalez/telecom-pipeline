services:
  db:
    image: postgres:16
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  pipeline:
    build: .
    depends_on:
      - db
    env_file:
      - .env

volumes:
  pgdata: